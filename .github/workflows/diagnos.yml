name: Diagnos (TED-syntax)
on:
  workflow_dispatch: {}
jobs:
  diagnos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kör syntax-diagnos mot TED API
        run: python diagnos.py
